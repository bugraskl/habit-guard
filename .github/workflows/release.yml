name: Release

# Tag vX.Y.Z (matching __version__ in src/habit_guard/__init__.py and a "## [X.Y.Z] - YYYY-MM-DD"
# section in CHANGELOG.md) to build all packages and publish a GitHub release. Run it manually to
# build the packages without publishing (they are kept as workflow artifacts).
#
# Building, packaging and smoke-testing are defined once, in build.yml, which bundle.yml runs the
# same way for pull requests; only publishing is defined here.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tagged commit must pass what CI checks, the privacy scan above all: the promise that
  # the program has no networking code is enforced there and nowhere in the build.
  verify:
    name: Tests and privacy check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Privacy check (no network code, no pictures written)
        run: uv run --no-sync python scripts/check_privacy.py

      - name: Verify the bundled models
        run: uv run --no-sync python scripts/fetch_models.py --check

      - name: Run the tests
        run: uv run --no-sync pytest -q

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      upload: true
    # Only the optional macOS signing certificate (see packaging/macos/make_dmg.sh).
    secrets:
      MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      # Only the optional Windows signing through SignPath (see docs/package-managers.md).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  release:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance attestations (Sigstore), verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
      # Start the website build (pages.yml) once the release exists.
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # By name, never everything: with signing on, the run also holds the unsigned program files
      # and installer, and a file of the same name must not be able to replace the signed one.
      - name: Download the Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: artifacts

      - name: Download the macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: artifacts

      - name: Download the Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: artifacts

      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: artifacts

      - name: Compute checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          expected=(
            "HabitGuard-$VERSION-windows-x64-setup.exe"
            "HabitGuard-$VERSION-windows-x64-portable.zip"
            "HabitGuard-$VERSION-macos-arm64.dmg"
            "HabitGuard-$VERSION-linux-x86_64.AppImage"
            "HabitGuard-$VERSION-linux-x86_64.tar.gz"
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "::error::missing $file"; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Attest the build provenance
        # Attestations need a public repository (or GitHub Enterprise Cloud).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/HabitGuard-${{ env.VERSION }}-windows-x64-setup.exe
            artifacts/HabitGuard-${{ env.VERSION }}-windows-x64-portable.zip
            artifacts/HabitGuard-${{ env.VERSION }}-macos-arm64.dmg
            artifacts/HabitGuard-${{ env.VERSION }}-linux-x86_64.AppImage
            artifacts/HabitGuard-${{ env.VERSION }}-linux-x86_64.tar.gz

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Habit Guard ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/HabitGuard-${{ env.VERSION }}-windows-x64-setup.exe
            artifacts/HabitGuard-${{ env.VERSION }}-windows-x64-portable.zip
            artifacts/HabitGuard-${{ env.VERSION }}-macos-arm64.dmg
            artifacts/HabitGuard-${{ env.VERSION }}-linux-x86_64.AppImage
            artifacts/HabitGuard-${{ env.VERSION }}-linux-x86_64.tar.gz
            artifacts/SHA256SUMS.txt

      - name: Rebuild the website with this release
        # A release published with the workflow's own token starts no other workflow, so
        # pages.yml's "release published" trigger never fires for it; start the website build
        # explicitly. Pre-releases are not shown.
        if: ${{ needs.build.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Update the package-manager manifests
        # The Scoop bucket, the Homebrew cask and the AUR files describe the newest release, and
        # are checked by installing it (packages.yml). Pre-releases are not offered there.
        if: ${{ needs.build.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
