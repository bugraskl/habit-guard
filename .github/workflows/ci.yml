name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch / pull request; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONUTF8: "1"
  # Qt runs headless everywhere; no display server is needed.
  QT_QPA_PLATFORM: offscreen
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Lint, types and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run --no-sync ruff format --check --diff .

      - name: Mypy (package)
        run: uv run --no-sync mypy

      # This job runs on Linux, where mypy skips the code behind
      # `sys.platform == "win32"` / `"darwin"` checks; check it as those platforms too.
      - name: Mypy (package, as on Windows)
        run: uv run --no-sync mypy --platform win32

      - name: Mypy (package, as on macOS)
        run: uv run --no-sync mypy --platform darwin

      - name: Mypy (scripts and the PyInstaller entry point)
        run: uv run --no-sync mypy scripts packaging/pyinstaller/entry.py

      - name: Privacy check (no network code, no pictures written)
        run: uv run --no-sync python scripts/check_privacy.py

      - name: Verify the bundled models
        run: uv run --no-sync python scripts/fetch_models.py --check

      - name: Check packaging scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils shellcheck
          shellcheck packaging/linux/build_appimage.sh packaging/linux/AppRun packaging/macos/make_dmg.sh
          desktop-file-validate packaging/linux/habit-guard.desktop

      - name: README pictures are up to date
        run: |
          uv run --no-sync python scripts/make_assets.py
          git diff --exit-code -- assets

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
        python:
          - "3.12"
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.13"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the tests
        run: uv run --no-sync pytest -q --durations=15
