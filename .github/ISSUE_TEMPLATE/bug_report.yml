name: Bug report
description: Something does not work as described. Please include the "habit-guard doctor" output.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!

        **Security or privacy issue?** Do not file it here; use
        [private vulnerability reporting](https://github.com/bugraskl/habit-guard/security/advisories/new) instead.

        Never attach camera pictures or screenshots that show your face. The diagnostics report
        below contains no pictures and shows paths relative to your home folder.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - False alarm (it went off, but it should not have)
        - Missed habit (my hand was in the zone and nothing happened)
        - Camera does not open
        - Crash or error message
        - Interface, tray, sound, voice or screen curtain
        - Something else
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description. What did you expect to happen instead?
      placeholder: The alarm went off while I was drinking from a mug…
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Habit, settings and setup
      description: |
        Which habit, its dwell time and zone size, what you were doing, how the camera is placed and
        how the light is. What did **Camera preview** show (in words, please)?
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Habit Guard version
      description: Run `habit-guard --version`, or give the commit if you run from source.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `habit-guard doctor`
      description: |
        Paste the whole report. From a source checkout: `uv run habit-guard doctor`.
        For camera problems use `uv run habit-guard doctor --probe-cameras`.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional)
      description: The doctor report shows where the log file is.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: I removed anything I do not want to share publicly from the pasted text.
          required: true
